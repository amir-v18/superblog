name: CI

on:
  push:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests and code style
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      # A disposable key for CI only; tests do not use real application credentials.
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: curl, dom, mbstring, pdo_sqlite, sqlite3, xml
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment file
        run: test -f .env.example && cp .env.example .env || touch .env

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel tests
        run: composer test

      - name: Check code formatting
        run: vendor/bin/pint --test

      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          else
            git diff-tree --check --root -r "$HEAD_SHA"
          fi
